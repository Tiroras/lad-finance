</g>
<text x="518" y="338" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Да</text>
<text x="300" y="421.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Нет</text>
<text x="295" y="720" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Да</text>
<text x="518" y="629.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Нет</text>
