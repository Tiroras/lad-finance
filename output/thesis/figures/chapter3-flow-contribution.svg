<text x="270" y="503.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">проверить остаток цели,</text>
<text x="270" y="531.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">источник и финансовые ограничения</text>
