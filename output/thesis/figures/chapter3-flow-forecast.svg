<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker></defs>
<rect width="800" height="800" fill="#fff"/>
<g fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)">
<polyline points="400,56 400,77"/>
<polyline points="400,143 400,164"/>
<polyline points="400,230 400,251"/>
<polyline points="400,317 400,338"/>
<polyline points="400,404 400,425"/>
<polyline points="400,515 400,536"/>
<polyline points="400,634 400,655"/>
<polyline points="400,721 400,742"/>
<polyline points="185,585 42,585 42,371 95,371"/>
</g>
<rect x="280" y="18" width="240" height="38" rx="22" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="44" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Начало</text>
<polygon points="113,77 705,77 687,143 95,143" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="104" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Состояние, дата, горизонт</text>
<text x="400" y="130" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">и назначения счетов</text>
<rect x="95" y="164" width="610" height="66" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="191" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Собрать события с исходными</text>
<text x="400" y="217" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">ключами и версиями условий</text>
<rect x="95" y="251" width="610" height="66" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="278" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Задать движения по счетам;</text>
<text x="400" y="304" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">выделить неназначенное влияние</text>
<rect x="95" y="338" width="610" height="66" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="365" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Обработать очередной день:</text>
<text x="400" y="391" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">остатки счетов и снятие удержаний</text>
<rect x="95" y="425" width="610" height="90" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="451" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Переоценить доступные повседневные остатки;</text>
<text x="400" y="477" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">добавить неназначенное влияние;</text>
<text x="400" y="503" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">сравнить сводку с резервом</text>
<polygon points="400,536 615,585 400,634 185,585" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="579" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Есть следующий</text>
<text x="400" y="605" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">день?</text>
<polygon points="113,655 705,655 687,721 95,721" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="682" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Траектории, минимумы и предупреждения;</text>
<text x="400" y="708" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">фактический учёт не меняется</text>
<rect x="280" y="742" width="240" height="38" rx="22" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="768" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Конец</text>
<text x="147" y="576" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Да</text>
<text x="425" y="650" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Нет</text>
</svg>
