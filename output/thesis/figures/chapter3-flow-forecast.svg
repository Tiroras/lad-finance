<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1020" viewBox="0 0 800 1020" data-diagram="forecast">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker></defs>
<rect width="800" height="1020" fill="#fff"/>
<polyline data-from="start" data-to="input" data-condition="" points="270,58 270,80" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="input" data-to="events" data-condition="" points="270,146 270,174" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="events" data-to="valid" data-condition="" points="270,270 270,300" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="day" data-to="total" data-condition="" points="270,536 270,566" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="total" data-to="more" data-condition="" points="270,662 270,702" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="output" data-to="end" data-condition="" points="270,922 270,962" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="valid" data-to="day" data-condition="Да" points="270,400 270,440" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="valid" data-to="error" data-condition="Нет" points="490,350 554,350" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="more" data-to="advance" data-condition="Да" points="490,752 545,752" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="advance" data-to="day" data-condition="" points="660,700 660,488 490,488" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="more" data-to="output" data-condition="Нет" points="270,802 270,846" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="error" data-to="end" data-condition="" points="766,350 788,350 788,982 380,982" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-node="start" data-kind="term">
<rect x="160" y="18" width="220" height="40" rx="20" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="45.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Начало</text>
</g>
<g data-node="input" data-kind="io">
<polygon points="68,80 490,80 472,146 50,146" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="105.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Состояние, дата, горизонт</text>
<text x="270" y="131.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">и назначения счетов</text>
</g>
<g data-node="events" data-kind="process">
<rect x="50" y="174" width="440" height="96" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="201.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Проверить параметры и курсы;</text>
<text x="270" y="227.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">собрать события по датам;</text>
<text x="270" y="252" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">начать с сегодняшнего дня</text>
</g>
<g data-node="valid" data-kind="decision">
<polygon points="270,300 490,350 270,400 50,350" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="344.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Расчёт</text>
<text x="270" y="370.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">возможен?</text>
</g>
<g data-node="day" data-kind="process">
<rect x="50" y="440" width="440" height="96" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="467.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Обработать день:</text>
<text x="270" y="492" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">движения по счетам</text>
<text x="270" y="519.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">и снятие удержаний</text>
</g>
<g data-node="total" data-kind="process">
<rect x="50" y="566" width="440" height="96" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="593.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Переоценить остатки;</text>
<text x="270" y="620" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">добавить неназначенное влияние;</text>
<text x="270" y="643.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">сопоставить с резервом</text>
</g>
<g data-node="more" data-kind="decision">
<polygon points="270,702 490,752 270,802 50,752" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="744.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Есть следующий</text>
<text x="270" y="771" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">день?</text>
</g>
<g data-node="advance" data-kind="process">
<rect x="545" y="700" width="230" height="104" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="660" y="731.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Перейти</text>
<text x="660" y="755.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">к следующему</text>
<text x="660" y="782" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">дню</text>
</g>
<g data-node="output" data-kind="io">
<polygon points="68,846 490,846 472,922 50,922" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="876.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Остатки, минимумы, дефицит</text>
<text x="270" y="900.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">и предупреждения</text>
</g>
<g data-node="end" data-kind="term">
<rect x="160" y="962" width="220" height="40" rx="20" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="987.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Конец</text>
</g>
<g data-node="error" data-kind="io">
<polygon points="563,302 775,302 757,398 545,398" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="660" y="344.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Ошибка</text>
<text x="660" y="367" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">исходных данных</text>
</g>
<text x="295" y="426" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Да</text>
<text x="518" y="339.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Нет</text>
<text x="518" y="740" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Да</text>
<text x="300" y="831.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Нет</text>
</svg>
