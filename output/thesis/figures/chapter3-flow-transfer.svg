<svg xmlns="http://www.w3.org/2000/svg" width="800" height="950" viewBox="0 0 800 950" data-diagram="transfer">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker></defs>
<rect width="800" height="950" fill="#fff"/>
<polyline data-from="start" data-to="input" data-condition="" points="270,58 270,86" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="input" data-to="prepare" data-condition="" points="270,152 270,180" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="prepare" data-to="valid-transfer" data-condition="" points="270,248 270,280" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="prepare-fee" data-to="valid-fee" data-condition="" points="270,622 270,656" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="output" data-to="end" data-condition="" points="270,862 270,894" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="valid-transfer" data-to="fee-selected" data-condition="Да" points="270,380 270,416" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="valid-transfer" data-to="error" data-condition="Нет" points="490,330 540,330 540,706 554,706" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="fee-selected" data-to="prepare-fee" data-condition="Да" points="270,516 270,554" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="fee-selected" data-to="output" data-condition="Нет" points="50,466 24,466 24,778 270,778 270,796" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="valid-fee" data-to="output" data-condition="Да" points="270,756 270,796" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="valid-fee" data-to="error" data-condition="Нет" points="490,706 554,706" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="error" data-to="end" data-condition="" points="660,754 660,914 380,914" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-node="start" data-kind="term">
<rect x="160" y="18" width="220" height="40" rx="20" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="45.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Начало</text>
</g>
<g data-node="input" data-kind="io">
<polygon points="68,86 490,86 472,152 50,152" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="111.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Счета, дата, суммы перевода</text>
<text x="270" y="139.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">и необязательная комиссия</text>
</g>
<g data-node="prepare" data-kind="process">
<rect x="50" y="180" width="440" height="68" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="206.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Проверить ввод и условия комиссии;</text>
<text x="270" y="230.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">подготовить перевод</text>
</g>
<g data-node="valid-transfer" data-kind="decision">
<polygon points="270,280 490,330 270,380 50,330" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="322.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Перевод</text>
<text x="270" y="348.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">допустим?</text>
</g>
<g data-node="fee-selected" data-kind="decision">
<polygon points="270,416 490,466 270,516 50,466" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="460.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Комиссия</text>
<text x="270" y="484.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">выбрана?</text>
</g>
<g data-node="prepare-fee" data-kind="process">
<rect x="50" y="554" width="440" height="68" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="580.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Подготовить и проверить</text>
<text x="270" y="606.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">отдельный расход комиссии</text>
</g>
<g data-node="valid-fee" data-kind="decision">
<polygon points="270,656 490,706 270,756 50,706" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="699" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Расход комиссии</text>
<text x="270" y="724.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">допустим?</text>
</g>
<g data-node="output" data-kind="io">
<polygon points="68,796 490,796 472,862 50,862" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="821.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Применить выбранные записи</text>
<text x="270" y="846" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">одним состоянием</text>
</g>
<g data-node="end" data-kind="term">
<rect x="160" y="894" width="220" height="40" rx="20" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="919.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Конец</text>
</g>
<g data-node="error" data-kind="io">
<polygon points="563,658 775,658 757,754 545,754" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="660" y="699" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Ошибка;</text>
<text x="660" y="724" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">учёт не изменён</text>
</g>
<text x="295" y="404" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Да</text>
<text x="518" y="319.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Нет</text>
<text x="295" y="543" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Да</text>
<text x="42" y="452.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Нет</text>
<text x="295" y="782" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Да</text>
<text x="518" y="695.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Нет</text>
</svg>
