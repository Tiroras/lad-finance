<text x="270" y="814.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Повторная проверка</text>
<text x="270" y="840.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">пройдена?</text>
</g>
