<text x="270" y="437.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Построить два прогноза</text>
<text x="270" y="462" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">из одного состояния;</text>
<text x="270" y="489.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">сопоставить показатели</text>
</g>
