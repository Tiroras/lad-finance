<text x="660" y="197.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Ошибка условий;</text>
<text x="660" y="221.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">исправить ввод</text>
