<text x="270" y="942.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Вернуть состояние</text>
<text x="270" y="968" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">с сохранёнными условиями сценария</text>
</g>
<g data-node="end" data-kind="term">
