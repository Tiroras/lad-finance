<text x="270" y="561.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Сравнение остатков, минимумов</text>
<text x="270" y="585.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">и имеющиеся предупреждения</text>
</g>
