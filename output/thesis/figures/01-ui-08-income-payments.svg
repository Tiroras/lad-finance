<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="95.87mm" viewBox="0 0 1200 719">
<title>План дохода и Новый платёж</title>
<desc>Структурные схемы расположения элементов. Области прокрутки показаны условно. Денежные значения и персональные сведения не заполнены. Показаны новые повторяющиеся планы без истории прежних условий.</desc>
<style>text{font-family:Arial,sans-serif;font-size:30px;fill:#000}.bold{font-weight:700}.title{font-size:36px;font-weight:700}rect,line,path,circle{stroke:#000;stroke-width:2;fill:#fff}line,path{fill:none}</style>
<rect width="1200" height="719" style="fill:#fff;stroke:none"/>
<rect x="624" y="24" width="552" height="671" rx="14"/>
<rect x="24" y="24" width="552" height="671" rx="14"/>
<text x="48.0" y="70.0" class="title" text-anchor="start">План дохода</text>
<line x1="527.0" y1="45.0" x2="548.0" y2="66.0" stroke-width="2"/>
<line x1="548.0" y1="45.0" x2="527.0" y2="66.0" stroke-width="2"/>
<line x1="40.0" y1="92.0" x2="560.0" y2="92.0" stroke-width="2"/>
<rect x="48.0" y="110.0" width="504.0" height="60.0" rx="7" stroke-dasharray="8 6"/>
