<text x="64.0" y="221.0" class="normal" text-anchor="start">Название</text>
<text x="534.0" y="222.0" class="normal" text-anchor="end">—</text>
<rect x="48.0" y="254.0" width="504.0" height="60.0" rx="7"/>
<text x="64.0" y="293.0" class="normal" text-anchor="start">Ожидаемая сумма</text>
<text x="534.0" y="294.0" class="normal" text-anchor="end">—</text>
<rect x="48.0" y="326.0" width="504.0" height="57.0" rx="7"/>
