<text x="534.0" y="507.0" class="normal" text-anchor="end">—</text>
<rect x="48.0" y="539.0" width="504.0" height="60.0" rx="7"/>
<text x="64.0" y="578.0" class="normal" text-anchor="start">Куда ожидается доход</text>
<text x="534.0" y="579.0" class="normal" text-anchor="end">—</text>
<rect x="48.0" y="611.0" width="504.0" height="60.0" rx="7"/>
