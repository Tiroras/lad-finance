<text x="664.0" y="149.0" class="normal" text-anchor="start">Название</text>
<text x="1134.0" y="150.0" class="normal" text-anchor="end">—</text>
<rect x="648.0" y="182.0" width="504.0" height="60.0" rx="7"/>
