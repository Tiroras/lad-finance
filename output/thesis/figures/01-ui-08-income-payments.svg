<text x="1134.0" y="510.0" class="normal" text-anchor="end">—</text>
<rect x="648.0" y="542.0" width="504.0" height="60.0" rx="7"/>
<text x="900.0" y="581.0" class="bold" text-anchor="middle">Сохранить платёж</text>
</svg>