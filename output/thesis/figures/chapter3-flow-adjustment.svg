<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1050" viewBox="0 0 800 1050" data-diagram="adjustment">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker></defs>
<rect width="800" height="1050" fill="#fff"/>
<polyline data-from="start" data-to="input" data-condition="" points="270,58 270,80" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="input" data-to="check" data-condition="" points="270,146 270,170" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="check" data-to="valid" data-condition="" points="270,240 270,266" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="candidate" data-to="finance" data-condition="" points="270,616 270,646" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="output" data-to="end" data-condition="" points="270,956 270,990" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="valid" data-to="nonzero" data-condition="Да" points="270,356 270,390" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="valid" data-to="error" data-condition="Нет" points="50,311 24,311 24,728 145,728 145,746" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
