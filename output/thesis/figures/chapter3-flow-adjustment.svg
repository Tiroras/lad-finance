<polyline data-from="finance" data-to="valid-state" data-condition="" points="270,716 270,730 530,730 530,746" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="valid-state" data-to="output" data-condition="Да" points="530,836 530,856 270,856 270,876" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="valid-state" data-to="error" data-condition="Нет" points="310,791 251,791" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="error" data-to="end" data-condition="" points="145,836 145,856 24,856 24,1010 160,1010" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="zero" data-to="end" data-condition="" points="775,490 788,490 788,1010 380,1010" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-node="start" data-kind="term">
<rect x="160" y="18" width="220" height="40" rx="20" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="45.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Начало</text>
</g>
<g data-node="input" data-kind="io">
<polygon points="68,80 490,80 472,146 50,146" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="106" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Счёт, дата, остаток,</text>
<text x="270" y="129.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">согласие и причина</text>
</g>
<g data-node="check" data-kind="process">
<rect x="50" y="170" width="440" height="70" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="197.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Проверить ввод и отпечаток;</text>
<text x="270" y="221.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">заново определить разницу</text>
</g>
<g data-node="valid" data-kind="decision">
<polygon points="270,266 490,311 270,356 50,311" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="304" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Ввод</text>
<text x="270" y="329.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">допустим?</text>
</g>
<g data-node="nonzero" data-kind="decision">
<polygon points="270,390 490,435 270,480 50,435" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="427.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Разница</text>
<text x="270" y="453.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">ненулевая?</text>
</g>
<g data-node="candidate" data-kind="process">
<rect x="50" y="520" width="440" height="96" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="547.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Проверить согласие, счёт и причину;</text>
<text x="270" y="571.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">подготовить датированную</text>
<text x="270" y="597.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">корректировку в новом состоянии</text>
</g>
<g data-node="finance" data-kind="process">
<rect x="50" y="646" width="440" height="70" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="673.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Проверить цели и их освобождения,</text>
<text x="270" y="697.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">кредит и числовые пределы</text>
</g>
<g data-node="valid-state" data-kind="decision">
<polygon points="530,746 750,791 530,836 310,791" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="530" y="783.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Все проверки</text>
<text x="530" y="809.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">пройдены?</text>
</g>
<g data-node="output" data-kind="io">
<polygon points="68,876 490,876 472,956 50,956" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="908.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Вернуть корректировку и сверку</text>
<text x="270" y="936.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">с обновлённым отпечатком</text>
</g>
<g data-node="end" data-kind="term">
<rect x="160" y="990" width="220" height="40" rx="20" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="1015.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Конец</text>
</g>
<g data-node="error" data-kind="io">
<polygon points="48,746 260,746 242,836 30,836" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="145" y="784" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Ошибка;</text>
<text x="145" y="809" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">учёт не изменён</text>
</g>
<g data-node="zero" data-kind="subprocess">
<rect x="545" y="450" width="230" height="80" fill="#fff" stroke="#000" stroke-width="1.8"/>
<path d="M 561 450 V 530 M 759 450 V 530" fill="none" stroke="#000" stroke-width="1.8"/>
<text x="660" y="482.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Обычная сверка</text>
<text x="660" y="508.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">без корректировки</text>
</g>
<text x="295" y="380" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Да</text>
<text x="28" y="300.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Нет</text>
<text x="295" y="507" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Да</text>
<text x="518" y="421.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Нет</text>
<text x="555" y="862" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Да</text>
<text x="282" y="780.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Нет</text>
</svg>
