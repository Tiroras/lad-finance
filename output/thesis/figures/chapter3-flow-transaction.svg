<svg xmlns="http://www.w3.org/2000/svg" width="800" height="950" viewBox="0 0 800 950" data-diagram="transaction">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker></defs>
<rect width="800" height="950" fill="#fff"/>
<polyline data-from="start" data-to="input" data-condition="" points="400,58 400,86" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="input" data-to="kind" data-condition="" points="400,152 400,188" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="check" data-to="valid" data-condition="" points="400,574 400,596 270,596 270,620" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="output" data-to="end" data-condition="" points="270,846 270,890" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="error" data-to="end-error" data-condition="" points="660,718 660,770" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="kind" data-to="income" data-condition="Доход" points="200,243 140,243 140,350" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="kind" data-to="expense" data-condition="Расход" points="400,298 400,350" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="kind" data-to="refund" data-condition="Возврат" points="600,243 660,243 660,350" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="income" data-to="check" data-condition="" points="140,430 140,454 400,454 400,478" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="expense" data-to="check" data-condition="" points="400,430 400,478" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="refund" data-to="check" data-condition="" points="660,430 660,454 400,454 400,478" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="valid" data-to="output" data-condition="Да" points="270,720 270,770" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline data-from="valid" data-to="error" data-condition="Нет" points="490,670 554,670" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-node="start" data-kind="term">
<rect x="290" y="18" width="220" height="40" rx="20" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="45.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Начало</text>
</g>
<g data-node="input" data-kind="io">
<polygon points="93,86 725,86 707,152 75,152" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="111.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Сумма, дата, счёт, вид операции</text>
<text x="400" y="137.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">и данные выбранного вида</text>
</g>
<g data-node="kind" data-kind="decision">
<polygon points="400,188 600,243 400,298 200,243" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="236" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Вид</text>
<text x="400" y="259.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">операции</text>
</g>
<g data-node="income" data-kind="process">
<rect x="20" y="350" width="240" height="80" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="140" y="383" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Подготовить</text>
<text x="140" y="407" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">доход</text>
</g>
<g data-node="expense" data-kind="process">
<rect x="280" y="350" width="240" height="80" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="382.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Подготовить расход</text>
<text x="400" y="408.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">и выбранные части</text>
</g>
<g data-node="refund" data-kind="process">
<rect x="540" y="350" width="240" height="80" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="660" y="382.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Связать возврат</text>
<text x="660" y="408.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">с покупкой</text>
</g>
<g data-node="check" data-kind="process">
<rect x="75" y="478" width="650" height="96" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="400" y="505.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Проверить суммы, даты и ссылки;</text>
<text x="400" y="531.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">ограничения частей и возврата;</text>
<text x="400" y="557.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">финансовую согласованность кандидата</text>
</g>
<g data-node="valid" data-kind="decision">
<polygon points="270,620 490,670 270,720 50,670" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="664.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Изменение</text>
<text x="270" y="688.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">допустимо?</text>
</g>
<g data-node="output" data-kind="io">
<polygon points="68,770 490,770 472,846 50,846" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="800.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Вернуть состояние с операцией;</text>
<text x="270" y="824.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">пересчитать остатки и аналитику</text>
</g>
<g data-node="end" data-kind="term">
<rect x="160" y="890" width="220" height="40" rx="20" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="270" y="915.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Конец</text>
</g>
<g data-node="error" data-kind="io">
<polygon points="563,622 775,622 757,718 545,718" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="660" y="663" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Ошибка;</text>
<text x="660" y="688" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">учёт не изменён</text>
</g>
<g data-node="end-error" data-kind="term">
<rect x="560" y="770" width="200" height="40" rx="20" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text x="660" y="795.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Конец</text>
</g>
<text x="145" y="226" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Доход</text>
<text x="447" y="330" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Расход</text>
<text x="657" y="225.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Возврат</text>
<text x="295" y="751" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Да</text>
<text x="518" y="659.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#000">Нет</text>
</svg>
