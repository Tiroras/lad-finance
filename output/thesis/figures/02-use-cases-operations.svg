<text x="955" y="260.2" font-size="30" text-anchor="middle">согласованность</text>
<text x="955" y="296.2" font-size="30" text-anchor="middle">учёта</text>
</g>
<g id="H1" data-id="H1" data-role="usecase" data-primary="false" data-title="Записать доход">
