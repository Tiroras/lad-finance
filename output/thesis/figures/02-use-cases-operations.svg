<text x="600" y="827.2" font-size="30" text-anchor="middle">без связи с долгом;</text>
<text x="600" y="863.2" font-size="30" text-anchor="middle">владелец выбрал</text>
<text x="600" y="899.2" font-size="30" text-anchor="middle">разделение</text>
