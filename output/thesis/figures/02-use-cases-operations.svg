<text x="430" y="260.88" font-size="32" text-anchor="middle">Записать финансовую</text>
<text x="430" y="298.88" font-size="32" text-anchor="middle">операцию</text>
</g>
<g id="H5" data-id="H5" data-role="usecase" data-primary="false" data-title="Проверить финансовую согласованность учёта">
