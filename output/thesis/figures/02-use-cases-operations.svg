<g data-role="relation-label" data-from="U1" data-to="H5">
<text x="692.5" y="195.2" font-size="30" text-anchor="middle">«include»</text>
</g>
<g data-role="relation-label" data-from="H4" data-to="H2">
<text x="1060" y="850.2" font-size="30" text-anchor="middle">«extend»</text>
</g>
<g id="C1" data-role="condition-note" data-from="H4" data-to="H2">
<path d="M 385 747.5 H 795 L 815 767.5 V 922.5 H 385 Z M 795 747.5 V 767.5 H 815" fill="white" stroke="#111" stroke-width="1.5"/>
