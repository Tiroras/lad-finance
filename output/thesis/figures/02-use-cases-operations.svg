<text x="700" y="1308.2" font-size="30" text-anchor="middle">обычным доходом не считается.</text>
</g>
<g id="Owner" data-role="actor">
<g fill="none" stroke="#111" stroke-width="2.5"><circle cx="90" cy="207" r="20"/><path d="M 90 227 V 295 M 50 250 H 130 M 90 295 L 55 340 M 90 295 L 125 340"/></g>
<text x="90" y="379.2" font-size="30" text-anchor="middle">Владелец</text>
<text x="90" y="415.2" font-size="30" text-anchor="middle">учёта</text>
</g></g></svg>
