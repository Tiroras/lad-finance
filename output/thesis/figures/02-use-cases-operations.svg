<path data-from="H1" data-to="U1" data-relation="generalization" d="M 430 505 V 355" fill="none" stroke="#111" stroke-width="2.3" marker-end="url(#generalization-arrow)"/>
<path data-from="H2" data-to="U1" data-relation="generalization" d="M 955 450 L 578.49 324.25" fill="none" stroke="#111" stroke-width="2.3" marker-end="url(#generalization-arrow)"/>
