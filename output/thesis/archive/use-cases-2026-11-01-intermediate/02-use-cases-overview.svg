<path data-from="Owner" data-to="U8" data-relation="association" d="M 550 100 C 520 190, 520 1250, 465 1250" fill="none" stroke="#111" stroke-width="1.8"/>
<path data-from="Owner" data-to="U9" data-relation="association" d="M 650 100 C 680 190, 680 1250, 735 1250" fill="none" stroke="#111" stroke-width="1.8"/>
<path data-from="U9" data-to="U8" data-relation="include" d="M 950 1350 V 1400 H 250 V 1350" fill="none" stroke="#111" stroke-width="2.2" stroke-dasharray="10 7" marker-end="url(#open-arrow)"/>
