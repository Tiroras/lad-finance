<text x="250" y="1260.2" font-size="30" text-anchor="middle">Получать прогноз</text>
<text x="250" y="1296.2" font-size="30" text-anchor="middle">денежных остатков</text>
</g>
<g id="U9" data-role="usecase" data-title="Оценивать покупку и изменения финансового плана">
<ellipse cx="950" cy="1250" rx="215" ry="100" fill="white" stroke="#111" stroke-width="2.2"/>
