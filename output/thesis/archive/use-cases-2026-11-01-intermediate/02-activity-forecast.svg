<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350">
<title>Оценка финансового решения на основе прогноза</title>
<rect width="1200" height="1350" fill="white"/>
<defs><marker id="open-arrow" markerWidth="15" markerHeight="13" refX="13" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 1 L 13 6.5 L 2 12" fill="none" stroke="#111" stroke-width="2"/></marker><marker id="flow-arrow" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 12 6 L 1 11 Z" fill="#111"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#111">
<path data-from="Start" data-to="Choose" data-relation="control-flow" d="M 600 42 V 77.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Choose" data-to="Base" data-relation="control-flow" d="M 600 212.5 V 267.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Base" data-to="Variant" data-relation="control-flow" d="M 600 402.5 V 457.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Variant" data-to="Purpose" data-relation="control-flow" d="M 600 592.5 V 652" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Purpose" data-to="Purchase" data-relation="control-flow" d="M 400 715 H 300 V 847.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<rect x="110.18" y="790" width="159.64" height="40" fill="white"/>
<text x="190" y="819.52" font-size="28" text-anchor="middle">[покупка]</text>
<path data-from="Purpose" data-to="Scenario" data-relation="control-flow" d="M 800 715 H 900 V 847.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<rect x="932.2" y="790" width="175.6" height="40" fill="white"/>
<text x="1020" y="819.52" font-size="28" text-anchor="middle">[сценарий]</text>
<path data-from="Purchase" data-to="Merge" data-relation="control-flow" d="M 300 1022.5 V 1090 H 584" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Scenario" data-to="Merge" data-relation="control-flow" d="M 900 1022.5 V 1090 H 616" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Merge" data-to="Result" data-relation="control-flow" d="M 600 1106 V 1132.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Result" data-to="End" data-relation="control-flow" d="M 600 1267.5 V 1306" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<g id="Start" data-role="initial">
<circle cx="600" cy="30" r="12" fill="#111"/>
</g>
<g id="Choose" data-role="action">
<rect x="150" y="77.5" width="900" height="135" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="116.02" font-size="28" text-anchor="middle" font-weight="bold">Владелец · UC-09</text>
<text x="600" y="155.88" font-size="32" text-anchor="middle">Выбрать покупку или сценарий,</text>
<text x="600" y="193.88" font-size="32" text-anchor="middle">ввести условия и горизонт</text>
</g>
<g id="Base" data-role="action">
<rect x="150" y="267.5" width="900" height="135" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="306.02" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-08 / UC-09</text>
<text x="600" y="345.88" font-size="32" text-anchor="middle">Проверить ввод и рассчитать</text>
<text x="600" y="383.88" font-size="32" text-anchor="middle">прогноз по текущему плану</text>
</g>
<g id="Variant" data-role="action">
<rect x="150" y="457.5" width="900" height="135" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="496.02" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-08</text>
<text x="600" y="535.88" font-size="32" text-anchor="middle">Рассчитать прогноз с покупкой</text>
<text x="600" y="573.88" font-size="32" text-anchor="middle">или условиями сценария</text>
</g>
<g id="Purpose" data-role="decision">
<path d="M 600 652 L 800 715 L 600 778 L 400 715 Z" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="725.88" font-size="32" text-anchor="middle">Тип решения</text>
</g>
<g id="Purchase" data-role="action">
<rect x="40" y="847.5" width="520" height="175" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="300" y="886.02" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-09</text>
<text x="300" y="926.88" font-size="32" text-anchor="middle">Проверить выбранный счёт,</text>
<text x="300" y="964.88" font-size="32" text-anchor="middle">резерв и предупреждения</text>
<text x="300" y="1002.88" font-size="32" text-anchor="middle">на всём горизонте</text>
</g>
<g id="Scenario" data-role="action">
<rect x="640" y="847.5" width="520" height="175" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="900" y="886.02" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-09</text>
<text x="900" y="926.88" font-size="32" text-anchor="middle">Сравнить остатки, минимум</text>
<text x="900" y="964.88" font-size="32" text-anchor="middle">и даты риска двух</text>
<text x="900" y="1002.88" font-size="32" text-anchor="middle">вариантов плана</text>
</g>
<g id="Merge" data-role="decision">
<path d="M 600 1074 L 616 1090 L 600 1106 L 584 1090 Z" fill="white" stroke="#111" stroke-width="2.2"/>

</g>
<g id="Result" data-role="action">
<rect x="120" y="1132.5" width="960" height="135" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="1171.02" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-09</text>
<text x="600" y="1210.88" font-size="32" text-anchor="middle">Показать вывод и его причины</text>
<text x="600" y="1248.88" font-size="32" text-anchor="middle">Факты и исходные планы не меняются</text>
</g>
<g id="End" data-role="final">
<circle cx="600" cy="1320" r="14" fill="white" stroke="#111" stroke-width="2.2"/><circle cx="600" cy="1320" r="8" fill="#111"/>
</g>
</g></svg>
