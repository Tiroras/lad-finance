<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270">
<title>Связь планового события с фактической операцией</title>
<rect width="1200" height="1270" fill="white"/>
<defs><marker id="open-arrow" markerWidth="15" markerHeight="13" refX="13" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 1 L 13 6.5 L 2 12" fill="none" stroke="#111" stroke-width="2"/></marker><marker id="flow-arrow" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 12 6 L 1 11 Z" fill="#111"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#111">
<path data-from="Start" data-to="Select" data-relation="control-flow" d="M 600 47 V 87.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Select" data-to="Validate" data-relation="control-flow" d="M 600 222.5 V 287.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Validate" data-to="Method" data-relation="control-flow" d="M 600 422.5 V 492" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Method" data-to="New" data-relation="control-flow" d="M 400 555 H 205 V 705" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<rect x="180.28000000000003" y="505" width="239.43999999999997" height="40" fill="white"/>
<text x="300" y="534.52" font-size="28" text-anchor="middle">[новая запись]</text>
<path data-from="Method" data-to="Pending" data-relation="control-flow" d="M 600 618 V 705" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<rect x="654.22" y="645" width="191.55999999999997" height="40" fill="white"/>
<text x="750" y="674.52" font-size="28" text-anchor="middle">[ожидающая]</text>
<path data-from="Method" data-to="Posted" data-relation="control-flow" d="M 800 555 H 995 V 705" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<rect x="788.26" y="505" width="223.48" height="40" fill="white"/>
<text x="900" y="534.52" font-size="28" text-anchor="middle">[проведённая]</text>
<path data-from="New" data-to="Merge" data-relation="control-flow" d="M 205 895 V 980 H 584" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Pending" data-to="Merge" data-relation="control-flow" d="M 600 895 V 964" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Posted" data-to="Merge" data-relation="control-flow" d="M 995 895 V 980 H 616" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Merge" data-to="Result" data-relation="control-flow" d="M 600 996 V 1035" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Result" data-to="End" data-relation="control-flow" d="M 600 1205 V 1231" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<g id="Start" data-role="initial">
<circle cx="600" cy="35" r="12" fill="#111"/>
</g>
<g id="Select" data-role="action">
<rect x="170" y="87.5" width="860" height="135" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="126.02" font-size="28" text-anchor="middle" font-weight="bold">Владелец · UC-06</text>
<text x="600" y="165.88" font-size="32" text-anchor="middle">Выбрать доход или платёж</text>
<text x="600" y="203.88" font-size="32" text-anchor="middle">и подтвердить исполнение</text>
</g>
<g id="Validate" data-role="action">
<rect x="170" y="287.5" width="860" height="135" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="326.02" font-size="28" text-anchor="middle" font-weight="bold">Лад</text>
<text x="600" y="365.88" font-size="32" text-anchor="middle">Проверить событие, сумму, счёт</text>
<text x="600" y="403.88" font-size="32" text-anchor="middle">и допустимость связи с операцией</text>
</g>
<g id="Method" data-role="decision">
<path d="M 600 492 L 800 555 L 600 618 L 400 555 Z" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="565.88" font-size="32" text-anchor="middle">Как исполнить?</text>
</g>
<g id="New" data-role="action">
<rect x="25" y="705" width="360" height="190" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="205" y="743.52" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-03 / UC-06</text>
<text x="205" y="793.2" font-size="30" text-anchor="middle">Создать проведённую</text>
<text x="205" y="829.2" font-size="30" text-anchor="middle">операцию и связать</text>
<text x="205" y="865.2" font-size="30" text-anchor="middle">с событием</text>
</g>
<g id="Pending" data-role="action">
<rect x="420" y="705" width="360" height="190" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="743.52" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-03 / UC-06</text>
<text x="600" y="793.2" font-size="30" text-anchor="middle">Провести ожидающую</text>
<text x="600" y="829.2" font-size="30" text-anchor="middle">операцию, сохранив</text>
<text x="600" y="865.2" font-size="30" text-anchor="middle">связь с событием</text>
</g>
<g id="Posted" data-role="action">
<rect x="815" y="705" width="360" height="190" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="995" y="743.52" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-03 / UC-06</text>
<text x="995" y="793.2" font-size="30" text-anchor="middle">Привязать факт</text>
<text x="995" y="829.2" font-size="30" text-anchor="middle">к событию без нового</text>
<text x="995" y="865.2" font-size="30" text-anchor="middle">движения денег</text>
</g>
<g id="Merge" data-role="decision">
<path d="M 600 964 L 616 980 L 600 996 L 584 980 Z" fill="white" stroke="#111" stroke-width="2.2"/>

</g>
<g id="Result" data-role="action">
<rect x="150" y="1035" width="900" height="170" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="1073.52" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-02 / UC-03 / UC-06</text>
<text x="600" y="1111.88" font-size="32" text-anchor="middle">Согласованно сохранить изменение</text>
<text x="600" y="1149.88" font-size="32" text-anchor="middle">и показать остатки, историю</text>
<text x="600" y="1187.88" font-size="32" text-anchor="middle">и отметку исполнения события</text>
</g>
<g id="End" data-role="final">
<circle cx="600" cy="1245" r="14" fill="white" stroke="#111" stroke-width="2.2"/><circle cx="600" cy="1245" r="8" fill="#111"/>
</g>
</g></svg>
