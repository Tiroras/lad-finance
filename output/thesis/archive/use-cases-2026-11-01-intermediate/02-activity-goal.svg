<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320">
<title>Пополнение и вывод средств финансовой цели</title>
<rect width="1200" height="1320" fill="white"/>
<defs><marker id="open-arrow" markerWidth="15" markerHeight="13" refX="13" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 1 L 13 6.5 L 2 12" fill="none" stroke="#111" stroke-width="2"/></marker><marker id="flow-arrow" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 12 6 L 1 11 Z" fill="#111"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#111">
<path data-from="Start" data-to="Choose" data-relation="control-flow" d="M 600 47 V 82.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Choose" data-to="Direction" data-relation="control-flow" d="M 600 217.5 V 282" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Direction" data-to="CheckDeposit" data-relation="control-flow" d="M 400 345 H 300 V 482.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<rect x="66.24000000000001" y="420" width="207.51999999999998" height="40" fill="white"/>
<text x="170" y="449.52" font-size="28" text-anchor="middle">[пополнение]</text>
<path data-from="Direction" data-to="CheckWithdraw" data-relation="control-flow" d="M 800 345 H 900 V 482.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<rect x="966.14" y="420" width="127.71999999999998" height="40" fill="white"/>
<text x="1030" y="449.52" font-size="28" text-anchor="middle">[вывод]</text>
<path data-from="CheckDeposit" data-to="Deposit" data-relation="control-flow" d="M 300 657.5 V 717.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="CheckWithdraw" data-to="Withdraw" data-relation="control-flow" d="M 900 657.5 V 717.5" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Deposit" data-to="Merge" data-relation="control-flow" d="M 300 892.5 V 975 H 584" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Withdraw" data-to="Merge" data-relation="control-flow" d="M 900 892.5 V 975 H 616" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Merge" data-to="Commit" data-relation="control-flow" d="M 600 991 V 1025" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<path data-from="Commit" data-to="End" data-relation="control-flow" d="M 600 1195 V 1236" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#flow-arrow)"/>
<g id="Start" data-role="initial">
<circle cx="600" cy="35" r="12" fill="#111"/>
</g>
<g id="Choose" data-role="action">
<rect x="150" y="82.5" width="900" height="135" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="121.02" font-size="28" text-anchor="middle" font-weight="bold">Владелец · UC-05</text>
<text x="600" y="160.88" font-size="32" text-anchor="middle">Выбрать цель, сумму и счета</text>
<text x="600" y="198.88" font-size="32" text-anchor="middle">для пополнения или вывода</text>
</g>
<g id="Direction" data-role="decision">
<path d="M 600 282 L 800 345 L 600 408 L 400 345 Z" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="355.88" font-size="32" text-anchor="middle">Взнос или вывод?</text>
</g>
<g id="CheckDeposit" data-role="action">
<rect x="50" y="482.5" width="500" height="175" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="300" y="521.02" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-05</text>
<text x="300" y="561.88" font-size="32" text-anchor="middle">Проверить остаток цели</text>
<text x="300" y="599.88" font-size="32" text-anchor="middle">и доступные деньги</text>
<text x="300" y="637.88" font-size="32" text-anchor="middle">повседневного счёта</text>
</g>
<g id="CheckWithdraw" data-role="action">
<rect x="650" y="482.5" width="500" height="175" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="900" y="521.02" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-05</text>
<text x="900" y="561.88" font-size="32" text-anchor="middle">Проверить накопленное</text>
<text x="900" y="599.88" font-size="32" text-anchor="middle">и обеспеченность</text>
<text x="900" y="637.88" font-size="32" text-anchor="middle">остальных целей</text>
</g>
<g id="Deposit" data-role="action">
<rect x="50" y="717.5" width="500" height="175" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="300" y="756.02" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-02 / UC-05</text>
<text x="300" y="796.88" font-size="32" text-anchor="middle">Подготовить перевод</text>
<text x="300" y="834.88" font-size="32" text-anchor="middle">на накопительный счёт</text>
<text x="300" y="872.88" font-size="32" text-anchor="middle">и увеличение прогресса</text>
</g>
<g id="Withdraw" data-role="action">
<rect x="650" y="717.5" width="500" height="175" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="900" y="756.02" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-02 / UC-05</text>
<text x="900" y="796.88" font-size="32" text-anchor="middle">Подготовить освобождение</text>
<text x="900" y="834.88" font-size="32" text-anchor="middle">суммы цели и перевод</text>
<text x="900" y="872.88" font-size="32" text-anchor="middle">на повседневный счёт</text>
</g>
<g id="Merge" data-role="decision">
<path d="M 600 959 L 616 975 L 600 991 L 584 975 Z" fill="white" stroke="#111" stroke-width="2.2"/>

</g>
<g id="Commit" data-role="action">
<rect x="120" y="1025" width="960" height="170" rx="20" fill="white" stroke="#111" stroke-width="2.2"/>
<text x="600" y="1063.52" font-size="28" text-anchor="middle" font-weight="bold">Лад · UC-02 / UC-05</text>
<text x="600" y="1101.88" font-size="32" text-anchor="middle">Сохранить перевод и распределение</text>
<text x="600" y="1139.88" font-size="32" text-anchor="middle">одним изменением, обновить остатки</text>
<text x="600" y="1177.88" font-size="32" text-anchor="middle">счетов и прогресс цели</text>
</g>
<g id="End" data-role="final">
<circle cx="600" cy="1250" r="14" fill="white" stroke="#111" stroke-width="2.2"/><circle cx="600" cy="1250" r="8" fill="#111"/>
</g>
</g></svg>
