</g>
<g id="Owner" data-role="actor">
<g fill="none" stroke="#111" stroke-width="2.5"><circle cx="100" cy="367" r="20"/><path d="M 100 387 V 455 M 60 410 H 140 M 100 455 L 65 500 M 100 455 L 135 500"/></g>
