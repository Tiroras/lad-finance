<text x="950" y="622.88" font-size="32" text-anchor="middle">UC-02</text>
<text x="950" y="660.88" font-size="32" text-anchor="middle">Записать перевод</text>
<text x="950" y="698.88" font-size="32" text-anchor="middle">между счетами</text>
</g>
<g id="U3" data-role="usecase" data-title="UC-03 Учесть взнос в цель">
<ellipse cx="440" cy="200" rx="190" ry="95" fill="white" stroke="#111" stroke-width="2.2"/>
