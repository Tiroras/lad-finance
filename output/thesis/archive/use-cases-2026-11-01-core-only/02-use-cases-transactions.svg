<text x="440" y="210.88" font-size="32" text-anchor="middle">Учесть взнос</text>
<text x="440" y="248.88" font-size="32" text-anchor="middle">в цель</text>
</g>
<g id="U4" data-role="usecase" data-title="UC-04 Учесть вывод из цели">
