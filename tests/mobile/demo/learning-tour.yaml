      TITLE: "Выгрузка истории"
      TARGET: "transactions.export"
# Автопрокрутка шага 9 скрывает фильтр. Штатный возврат 9 → 8 показывает
# его снова и позволяет проверить результат первого нажатия без скролла.
- tapOn: "Назад по экскурсии"
- runFlow:
    file: ../subflows/learning-tour-step.yaml
