# Режим: demo; EXPO_PUBLIC_ENABLE_DEMO=true, EXPO_PUBLIC_RESET_ON_START=false.
# План: ../plans/learning-tour.md. Устройство: Pixel_8 / emulator-5554.
# Предусловие: завершён первый вход; сборка Demo соответствует исходникам.
# Выбор Demo и запуск с шага 1 выполняются через обычный интерфейс.
# Повторный запуск поддерживает новый, прерванный и завершённый маршрут.
# Финансовые записи не создаются; clearState и Fresh не используются.
appId: app.lad.finance
name: learning-tour
---
- launchApp
- extendedWaitUntil:
    visible: "Текущий профиль: .* Открыть профили"
    timeout: 30000
- runFlow:
    when:
      notVisible: "Текущий профиль: Демо. Открыть профили"
    commands:
      - tapOn: "Текущий профиль: .* Открыть профили"
      - tapOn: "Открыть профиль: Демо"
- assertVisible: "Текущий профиль: Демо. Открыть профили"
- tapOn: "Профиль и настройки"
- scrollUntilVisible:
    element:
      text: "Обучение"
    direction: DOWN
- tapOn: "Обучение"
- assertVisible: "Экскурсия по приложению"
- scrollUntilVisible:
    element:
      text: "Начать экскурсию|Пройти всё приложение заново"
    direction: DOWN
- tapOn: "Начать экскурсию|Пройти всё приложение заново"

# 1. Обзор: сколько можно потратить
- runFlow:
    file: ../subflows/learning-tour-step.yaml
    env:
      NUMBER: "1"
      TITLE: "Обзор: сколько можно потратить"
      TARGET: "home.formula"
- assertVisible:
    text: "Обзор"
    selected: true
- assertVisible:
    text: "Назад по экскурсии"
    enabled: false
- tapOn:
    text: "Как рассчитана доступная сумма"
    childOf:
      id: "tour-target-home.formula"

# 2. Из чего складывается сумма
- runFlow:
    file: ../subflows/learning-tour-step.yaml
    env:
      NUMBER: "2"
      TITLE: "Из чего складывается сумма"
      TARGET: "sheet.close"
- assertVisible:
    text: "Всё прозрачно"
    childOf:
      id: "sheet-drag-area"
- tapOn:
    text: "Закрыть"
    childOf:
      id: "tour-target-sheet.close"

# 3. Счета и остатки
- runFlow:
    file: ../subflows/learning-tour-step.yaml
    env:
      NUMBER: "3"
      TITLE: "Счета и остатки"
      TARGET: "home.accounts"
- assertVisible:
    text: "Обзор"
    selected: true
- tapOn:
    text: "Открыть мои счета"
    childOf:
      id: "tour-target-home.accounts"

# 4. Ваши счета и долги
