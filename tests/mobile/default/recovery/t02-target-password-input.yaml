# Clean independent target5562 at fresh baseline receiver SUCCESS. The selected
# FILE_NAME must be the source's actual protected export with verified SHA.
# Stops BEFORE submit. Controller checks exactly 18 masked characters in the
# password field, then starts the existing selection once with the next flow.
appId: app.lad.finance
name: t02-target-password-input
---
- tapOn: "Закрыть приёмник"
- runFlow:
    file: t02-pick-file.yaml
    env:
      PICKER_ACTION: Восстановить из файла
      FILE_NAME: ${FILE_NAME}
- scrollUntilVisible:
    element:
      text: "Пароль для восстановления"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Пароль для восстановления"
    waitToSettleTimeoutMs: 500
- inputText: ${PASSWORD}
- hideKeyboard
