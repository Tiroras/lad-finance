# Default; independent target5562 at receiver SUCCESS after target-baseline.
# FILE_NAME is the actual password v2 exported by source5560 and verified on host.
# NAME must be new. No new source/anchor generation, no source userdata copy.
# Stops at new receiver SUCCESS after target restart and actual full export.
appId: app.lad.finance
name: t02-target-transfer
---
- tapOn: "Закрыть приёмник"
- runFlow:
    file: t02-pick-file.yaml
    env:
      PICKER_ACTION: Восстановить из файла
      FILE_NAME: ${FILE_NAME}
- runFlow:
    file: t02-unlock-password.yaml
    env:
      PASSWORD: T02-synthetic-2026
      EXPECTED_RESULT: Большая копия проверена. Для сохранности исходного учёта восстановите её в новый профиль.
- runFlow:
    file: t02-new-profile.yaml
    env:
      NAME: ${NAME}
      TRANSACTIONS: "9997"
      ACCOUNTS: "3"
      GOALS: "0"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Текущий профиль: \Q${NAME}\E\. Открыть профили'
    timeout: 600000
- scrollUntilVisible:
    element:
      text: "Открыть мои счета"
    direction: DOWN
    timeout: 60000
- tapOn: "Открыть мои счета"
- assertVisible: "Основная карта, Повседневные расходы, 9 997 000,00 ₽"
- assertVisible: "Наличные, Повседневные расходы, 0,00 ₽"
- assertVisible: "Накопления, Накопления · вне доступного бюджета, 0,00 ₽"
- tapOn: "Закрыть"
- runFlow:
    file: t02-open-data.yaml
    env:
      PROFILE: ${NAME}
- runFlow: t02-export-json.yaml
