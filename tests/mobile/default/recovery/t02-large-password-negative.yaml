# Default, recovery-t02.md. Start in source Data after open-data.
# Only public synthetic t02-large.ladbackup (manifest required) in Downloads.
# Cancels one password selection, reselects it, rejects wrong password, then
# exports CURRENT SOURCE before any successful restore for full unchanged oracle.
# Keeps the encrypted selection for a later correct-password retry after receiver.
appId: app.lad.finance
name: t02-large-password-negative
---
- runFlow:
    file: t02-pick-file.yaml
    env:
      PICKER_ACTION: Восстановить из файла
      FILE_NAME: t02-large.ladbackup
- scrollUntilVisible:
    element:
      text: "Отмена ввода пароля"
    direction: DOWN
- tapOn: "Отмена ввода пароля"
- assertNotVisible: "Пароль для восстановления"
- scrollUntilVisible:
    element:
      text: "Восстановить из файла"
    direction: UP
- runFlow:
    file: t02-pick-file.yaml
    env:
      PICKER_ACTION: Восстановить из файла
      FILE_NAME: t02-large.ladbackup
- scrollUntilVisible:
    element:
      text: "Пароль для восстановления"
    direction: DOWN
- tapOn: "Пароль для восстановления"
- inputText: T02-wrong-password
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Открыть защищённую копию"
    direction: DOWN
- tapOn: "Открыть защищённую копию"
- extendedWaitUntil:
    visible: "Пароль неверный или файл повреждён. Данные не изменены."
    timeout: 600000
- assertNotVisible: "Заменить данные этой копией"
- takeScreenshot: large-wrong-password
- scrollUntilVisible:
    element:
      text: "Экспортировать резервную копию"
    direction: UP
- runFlow: t02-export-json.yaml
