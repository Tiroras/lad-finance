# План: ../../plans/recovery-t02.md, положительное открытие B10-02 / A03-01.
# Режим: default release, Lad_T02_Recovery_Test; блокировка выключена.
# Старт: t02-pick-file выбрал новую .ladbackup, поле пароля ПУСТОЕ.
# Для retry существующего значения использовать focus/MOVE_END/clear/fill guards
# и t02-unlock-entered-password. PASSWORD — публичный тестовый пароль.
# EXPECTED_RESULT задаётся точным ожидаемым составом/сообщением маршрута.
# По умолчанию — Notice большого импорта через «Восстановить из файла».
# Для «Проверить копию» передать regex полного «Копия проверена: ... Файл: ...».
# Финиш: положительный результат чтения, исходный учёт ещё не заменён.
# 600000 мс — ожидание KDF, не критерий производительности. T02 hierarchy pending.
appId: app.lad.finance
name: t02-unlock-password
---
- assertVisible: "Данные и копии"
- scrollUntilVisible:
    element:
      text: "Пароль для восстановления"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Пароль для восстановления"
    waitToSettleTimeoutMs: 500
- inputText: ${PASSWORD}
- hideKeyboard
- runFlow:
    file: t02-unlock-entered-password.yaml
    env:
      EXPECTED_RESULT: ${EXPECTED_RESULT}
