# План: ../../plans/recovery-t02.md, B10-01 / A03-02, три отдельные отметки.
# Режим: default release, Lad_T02_Recovery_Test; блокировка выключена.
# Старт: свежий SUCCESS после t02-export-*; контроллер уже сохранил receipt,
# выгрузил именно этот файл и проверил oracle. Экспорт после него не выполнять.
# Финиш: сохранение вручную подтверждено, чтение всё ещё не проверено.
# T02 hierarchy/dateLabel pending; DATE_LABEL задаётся по фактической дате UI.
appId: app.lad.finance
name: t02-confirm-saved
---
- assertVisible: "(?s)SUCCESS.*"
- tapOn: "Закрыть приёмник"
- extendedWaitUntil:
    visible: "Данные и копии"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'Последняя подготовленная копия: \Q${DATE_LABEL}\E\.'
    direction: UP
    timeout: 30000
- assertVisible: 'Последняя подготовленная копия: \Q${DATE_LABEL}\E\.'
- scrollUntilVisible:
    element:
      text: "Сохранение файла ещё не подтверждено вами."
    direction: DOWN
    timeout: 30000
- assertVisible: "Сохранение файла ещё не подтверждено вами."
- scrollUntilVisible:
    element:
      text: "Чтение этой копии ещё не проверено."
    direction: DOWN
    timeout: 30000
- assertVisible: "Чтение этой копии ещё не проверено."
- scrollUntilVisible:
    element:
      text: "Я сохранил файл"
    direction: DOWN
    timeout: 30000
- tapOn: "Я сохранил файл"
- scrollUntilVisible:
    element:
      text: "Сохранение файла подтверждено вами."
    direction: UP
    timeout: 30000
- assertVisible: "Сохранение файла подтверждено вами."
- scrollUntilVisible:
    element:
      text: "Чтение этой копии ещё не проверено."
    direction: DOWN
    timeout: 30000
- assertVisible: "Чтение этой копии ещё не проверено."
