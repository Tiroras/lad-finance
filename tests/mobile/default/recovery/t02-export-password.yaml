# План: ../../plans/recovery-t02.md, B10-01 / B10-02 / A03-02.
# Режим: default release, Lad_T02_Recovery_Test; блокировка выключена.
# Данные/старт: t02-open-data завершён, форма нового пароля закрыта.
# PASSWORD — только публичный пароль синтетической фикстуры T02.
# Финиш: новый SUCCESS; затем контроллер выгружает receipt/файл и считает oracle.
# 600000 мс разрешают завершение KDF, но не являются целью производительности.
# T02 hierarchy pending; receiver ранее подтверждён контроллером.
appId: app.lad.finance
name: t02-export-password
---
- assertVisible: "Данные и копии"
- scrollUntilVisible:
    element:
      text: "Создать копию с паролем"
    direction: DOWN
    timeout: 30000
- tapOn: "Создать копию с паролем"
- scrollUntilVisible:
    element:
      text: "Новый пароль копии"
    direction: DOWN
    timeout: 30000
- tapOn: "Новый пароль копии"
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Повтор пароля копии"
    direction: DOWN
    timeout: 30000
- tapOn: "Повтор пароля копии"
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Сохранить защищённую копию"
    direction: DOWN
    timeout: 30000
- tapOn: "Сохранить защищённую копию"
- extendedWaitUntil:
    visible: "A04 Test Receiver"
    timeout: 600000
- runFlow: ../security/a04-send-test-receiver.yaml
