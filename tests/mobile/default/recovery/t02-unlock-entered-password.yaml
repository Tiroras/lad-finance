# Public synthetic password already entered and its length verified by controller.
# Starts the existing file selection once; a busy transition alone is not success.
appId: app.lad.finance
name: t02-unlock-entered-password
---
- scrollUntilVisible:
    element:
      text: "Открыть защищённую копию"
    direction: DOWN
- tapOn: "Открыть защищённую копию"
- extendedWaitUntil:
    visible: "Проверка пароля…"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Проверка пароля…"
    timeout: 600000
- assertNotVisible: "Пароль неверный или файл повреждён. Данные не изменены."
- scrollUntilVisible:
    element:
      text: ${EXPECTED_RESULT}
    direction: DOWN
    timeout: 30000
- assertVisible: ${EXPECTED_RESULT}
- assertNotVisible: "Заменить данные этой копией"
