# Existing selection, public synthetic password already entered and its exact
# masked length verified on host. One submit only. Stops at busy, then the
# controller observes rarely without continuous hierarchy polling. Busy is not
# success; t02-target-after-open requires the explicit successful result later.
appId: app.lad.finance
name: t02-start-entered-password
---
- scrollUntilVisible:
    element:
      text: "Открыть защищённую копию"
    direction: DOWN
- tapOn: "Открыть защищённую копию"
- extendedWaitUntil:
    visible: "Проверка пароля…"
    timeout: 30000
