# Retry only: current encrypted selection remains open after a password refusal.
# Controller moves caret to KEYCODE_MOVE_END before a separate clear/fill stage;
# focusing by a center tap alone may leave suffix characters after eraseText.
appId: app.lad.finance
name: t02-password-focus
---
- runFlow:
    when:
      visible: "Закрыть приёмник"
    commands:
      - tapOn: "Закрыть приёмник"
- scrollUntilVisible:
    element:
      text: "Пароль для восстановления"
    direction: UP
- tapOn: "Пароль для восстановления"
