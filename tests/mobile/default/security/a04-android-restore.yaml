# Android DocumentsUI: a04-valid.ladbackup is visible in Recent / Downloads.
# Run a04-create-profile.yaml first, with protection still disabled.
appId: app.lad.finance
name: a04-android-restore
---
- assertVisible: "a04-valid.ladbackup"
- tapOn: "a04-valid.ladbackup"
- runFlow:
    when:
      visible: "Select"
    commands:
      - tapOn: "Select"
- runFlow: a04-restore-password.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Профиль и настройки"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Открыть мои счета"
    direction: DOWN
- tapOn: "Открыть мои счета"
- assertVisible: "Основная карта, Повседневные расходы, 9 300,00 ₽"
- assertVisible: "Накопления, Накопления · вне доступного бюджета, 1 000,00 ₽"
- tapOn: "Закрыть"
- tapOn: "Операции"
- tapOn: "Вся история"
- assertVisible: "A04 Income"
- assertVisible: "A04 Expense"
- assertVisible: "A04 Goal transfer"
