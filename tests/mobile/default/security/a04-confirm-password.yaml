# Both platforms, a04-valid.ladbackup selected; field may contain a wrong password.
# Loaded emulator observation: ~354 s, so completion timeout is 600 s.
appId: app.lad.finance
name: a04-confirm-password
---
- scrollUntilVisible:
    element:
      text: "Пароль для восстановления"
    direction: DOWN
    timeout: 30000
- tapOn: "Пароль для восстановления"
- eraseText
- inputText: "A04-synthetic-2026"
- hideKeyboard
- tapOn: "Открыть защищённую копию"
- extendedWaitUntil:
    notVisible: "Пароль для восстановления"
    timeout: 600000
- scrollUntilVisible:
    element:
      text: "Копия проверена"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ".*В файле 3 операций, 3 счетов, 1 целей и 0 сценариев.*"
    direction: DOWN
- assertVisible: ".*В файле 3 операций, 3 счетов, 1 целей и 0 сценариев.*"
- scrollUntilVisible:
    element:
      text: "Заменить данные этой копией"
    direction: DOWN
- tapOn: "Заменить данные этой копией"
- extendedWaitUntil:
    visible: "Профиль и настройки"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Открыть мои счета"
    direction: DOWN
- tapOn: "Открыть мои счета"
- assertVisible: "Основная карта, Повседневные расходы, 9 300,00 ₽"
- scrollUntilVisible:
    element:
      text: "Накопления, Накопления · вне доступного бюджета, 1 000,00 ₽"
    direction: DOWN
- assertVisible: "Накопления, Накопления · вне доступного бюджета, 1 000,00 ₽"
- tapOn: "Закрыть"
