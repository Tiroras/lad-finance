# Both platforms: operator selected a04-valid.ladbackup in the real file picker.
# Protection may require manual authentication after the picker (see protocol).
# Loaded Android emulator needed ~354 s for one password attempt (A04 report).
# This timeout permits completion; it is not a performance acceptance target.
appId: app.lad.finance
name: a04-restore-password
---
- scrollUntilVisible:
    element:
      text: "Пароль для восстановления"
    direction: DOWN
    timeout: 30000
- tapOn: "Пароль для восстановления"
- inputText: "A04-wrong-password"
- hideKeyboard
- tapOn: "Открыть защищённую копию"
- extendedWaitUntil:
    visible: "Пароль неверный или файл повреждён. Данные не изменены."
    timeout: 600000
- assertNotVisible: "Заменить данные этой копией"
- runFlow: a04-confirm-password.yaml
