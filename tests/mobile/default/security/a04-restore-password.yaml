# Both platforms: operator selected a04-valid.ladbackup in the real file picker.
# Protection may require manual authentication after the picker (see protocol).
appId: app.lad.finance
name: a04-restore-password
---
- extendedWaitUntil:
    visible: "Пароль для восстановления"
    timeout: 30000
- tapOn: "Пароль для восстановления"
- inputText: "A04-wrong-password"
- hideKeyboard
- tapOn: "Открыть защищённую копию"
- extendedWaitUntil:
    visible: "Пароль неверный или файл повреждён. Данные не изменены."
    timeout: 120000
- assertNotVisible: "Заменить данные этой копией"
- tapOn: "Пароль для восстановления"
- eraseText
- inputText: "A04-synthetic-2026"
- hideKeyboard
- tapOn: "Открыть защищённую копию"
- extendedWaitUntil:
    visible: "Копия проверена"
    timeout: 120000
- assertVisible: ".*В файле 3 операций, 3 счетов, 1 целей и 0 сценариев.*"
- tapOn: "Заменить данные этой копией"
- extendedWaitUntil:
    visible: "Профиль и настройки"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Открыть мои счета"
    direction: DOWN
- tapOn: "Открыть мои счета"
- assertVisible: "Основная карта, Повседневные расходы, 9 300,00 ₽"
- assertVisible: "Накопления, Накопления · вне доступного бюджета, 1 000,00 ₽"
- tapOn: "Закрыть"
