# Default, isolated synthetic profile, unlocked home. Uses the real export UI.
# Ends in Android Sharesheet. 600s is a test timeout, not a performance target.
appId: app.lad.finance
name: a04-create-password-export
---
- tapOn: "Профиль и настройки"
- scrollUntilVisible:
    element:
      text: "Данные и копии"
    direction: DOWN
- tapOn: "Данные и копии"
- scrollUntilVisible:
    element:
      text: "Создать копию с паролем"
    direction: DOWN
- tapOn: "Создать копию с паролем"
- scrollUntilVisible:
    element:
      text: "Новый пароль копии"
    direction: DOWN
- tapOn: "Новый пароль копии"
- inputText: "A04-synthetic-2026"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Повтор пароля копии"
    direction: DOWN
- tapOn: "Повтор пароля копии"
- inputText: "A04-synthetic-2026"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Сохранить защищённую копию"
    direction: DOWN
- tapOn: "Сохранить защищённую копию"
- extendedWaitUntil:
    visible: "A04 Test Receiver"
    timeout: 600000
