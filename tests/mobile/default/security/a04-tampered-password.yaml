# Both platforms. Operator selected a04-tampered.ladbackup; healthy A04 stays active.
appId: app.lad.finance
name: a04-tampered-password
---
- scrollUntilVisible:
    element:
      text: "Пароль для восстановления"
    direction: DOWN
    timeout: 30000
- tapOn: "Пароль для восстановления"
- inputText: "A04-synthetic-2026"
- hideKeyboard
- tapOn: "Открыть защищённую копию"
- extendedWaitUntil:
    visible: "Пароль неверный или файл повреждён. Данные не изменены."
    timeout: 600000
- assertNotVisible: "Заменить данные этой копией"
- tapOn: "Отмена ввода пароля"
- tapOn: "Закрыть"
