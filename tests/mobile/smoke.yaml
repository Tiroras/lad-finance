appId: app.lad.finance
---
- launchApp
- extendedWaitUntil:
    visible: "Пропустить знакомство|Начать с пустым профилем|Обзор"
    timeout: 120000
- runFlow:
    when:
      visible: "Пропустить знакомство"
    commands:
      - tapOn: "Пропустить знакомство"
- runFlow:
    when:
      visible: "Начать с пустым профилем"
    commands:
      - tapOn: "Начать с пустым профилем"
- assertVisible: "Обзор"

- tapOn: "Операции"
- assertVisible: "Ваши операции"

- tapOn: "План"
- assertVisible: "У всего есть план"

- tapOn: "Аналитика"
- assertVisible: "Понять свои привычки"

- tapOn: "Обзор"
- assertVisible: "Добавить операцию"
